[test]
pathIgnorePatterns = ["**/fixtures/**", "**/fixture/**"]
coverage = true
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["**/__tests__/**"]
concurrentTestGlob = "**/*.test.ts"
onlyFailures = true
preload = ["./src/test-utils/preload.ts"]

[install]
linker = "isolated"

[run]
bun = true
