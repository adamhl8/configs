name: Setup
description: Checkout, set up bun, install just, and run bun install

inputs:
  install-args:
    description: Extra arguments for bun install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up bun
      uses: oven-sh/setup-bun@v2

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Install
      shell: bash
      run: bun install ${{ inputs.install-args }}
