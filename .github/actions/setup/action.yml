name: Setup
description: Checkout, set up tools, and run bun install

inputs:
  install-args:
    description: Extra arguments for bun install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up bun
      uses: oven-sh/setup-bun@v2

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Install actionlint
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP/bin"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_wrapper: false

    - name: Install
      shell: bash
      run: bun install ${{ inputs.install-args }}
