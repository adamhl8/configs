name: Release

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      before-release:
        description: Shell commands to run after install, just before the release
        type: string
        required: false
        default: ""
      docker-image:
        description: ghcr.io image name to build and push after the release
        type: string
        required: false
        default: ""
    secrets:
      CI_SIGNING_KEY:
        required: true
      CI_TOKEN:
        required: false
      NPM_CI_TOKEN:
        required: false
      GH_TOKEN:
        required: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set up project
        uses: adamhl8/configs/.github/actions/setup@main

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Configure git identity and signing
        run: |
          git config user.name "Adam Langbert"
          git config user.email "adamhl@pm.me"
          mkdir -p ~/.ssh
          printf '%s\n' "$CI_SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/signing_key"
          git config commit.gpgsign true
          git config tag.gpgsign true
        env:
          CI_SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY }}

      - name: Run before-release commands
        if: inputs.before-release != ''
        run: ${{ inputs.before-release }}

      - name: Run release
        run: bunx bask release-run
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # the .npmrc from setup-node reads this, for npm (release-it's preflight checks) and `bun publish`
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_TOKEN }}

      - name: Get release tag
        id: tag
        run: |
          tag="$(git describe --tags --exact-match)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    if: inputs.docker-image != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          secrets: |
            GH_TOKEN=${{ secrets.GH_TOKEN }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.docker-image }}:latest
