name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false

jobs:
  validate:
    # an edit only changes the title or body, so there's nothing new to build
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: adamhl8/configs/.github/actions/setup@main

      - name: Build + lint
        run: just build
        env:
          # some projects require a github token with more permissions than the default repo scoped one
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Lint last commit message
        if: github.event_name == 'push'
        run: bun commitlint --last --verbose

  # lint only the PR title because squash merges (the only merge type allowed) use it as the commit message
  # the PR's own commits never reach main
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: adamhl8/configs/.github/actions/setup@main
        with:
          # commitlint only needs the installed packages, not a build
          install-args: --ignore-scripts

      - name: Lint PR title
        run: printf '%s\n' "$PR_TITLE" | bun commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
