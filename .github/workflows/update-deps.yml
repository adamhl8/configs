name: Update dependencies

on:
  schedule:
    - cron: "0 13 * * 5" # Fridays, 13:00 UTC
  workflow_dispatch: {}
  workflow_call:
    secrets:
      CI_TOKEN:
        required: true

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: adamhl8/configs/.github/actions/setup@main
        with:
          # skip an extra `prepare` run because `bump-deps` will run it
          install-args: --ignore-scripts

      - name: Update dependencies
        run: just bump-deps

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          branch: chore/update-deps
          delete-branch: true
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): update dependencies"
          body: ""
